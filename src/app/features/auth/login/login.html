<main>
  <section>
    <div class="welcome">
       <h2 class="citoyen">Bienvenue sur VigieCam</h2>
       <h3 class="citoyen">Cher Citoyen</h3>
       <p class="citoyen">Connecter-vous pour signaler et suivre les incidents dans votre communauté</p>
    </div>

    <div class="login-form">
      <form (ngSubmit)="connecter()">
        <div>
          <label for="nom">Nom complet : </label>
          <input type="text" placeholder="Entrez votre nom complet"
          [ngModel]="nom()" (ngModelChange)="nom.set($event)" name="nom" id="nom" required>
        </div>
        <div>
          <label for="email">Adresse Email : </label>
          <input type="email" placeholder="exemple@email.com"
          [ngModel]="email()" (ngModelChange)="email.set($event)" name="email" id="email" required>
        </div>
        <button type="submit">Se connecter</button>
        @if (message()) {
          <p>{{ message() }}</p>
        }
      </form>
    </div>
  </section>
</main>

<div class="formcontainer">
  <h2> Signaler un incident </h2>
      <p class="formdescription">Remplissez les informations ci-dessous pour signaler un incident.</p>

      <form (ngSubmit)="enregistrer()">
        <div class="formgroup">
          <label for="titre">Titre de l'incident</label>
          <input type="text" name="titre" placeholder="Ex.: Accident de circulation" required
          [(ngModel)]="titre"
          (ngModelChange)="titre.set($event)"/>
        </div>

        <div class="formgroup">
          <label for="description">Description</label>
          <textarea name="description" id="description" placeholder="Décrivez l'incident" required
          [(ngModel)]="description" rows="4"
          (ngModelChange)="description.set($event)"></textarea>
        </div>

        <div class="formgroup">
          <label for="categories">Categories</label>
          <select name="categories" id="categories" required
          [(ngModel)]="categories"
          (ngModelChange)="categories.set($event)"
          >
          <option value="">Choisir une categories</option>
          <option value="ACCIDENT">Accident</option>
          <option value="INCENDIE">incendie</option>
          <option value="INFRASTRUCTURE">Problème d'infrastructure</option>
          <option value="AUTRE">Autre</option>
          </select>
        </div>

        <div class="formgroup">
          <label for="type">Type d'incident</label>
          <select name="type" id="type" required
           [(ngModel)]="type"
           (ngModelChange)="type.set($event)">
           <option value="">Choisir un type</option>
           <option value="DOMESTIQUE">Domestique</option>
           <option value="INTER_URBAIN">Inter-urbain</option>
           </select>
        </div>

        @if (message()) {
          <p class="formmessage">{{message()}}</p>
        }

        <div class="btn">
          <button type="submit" class="btn1">Envoyer le signalement</button>
        <button type="button" routerLink="/tableau-bord" class="btn2"> retour au tableau de bord</button>
        </div>

      </form>
</div>
